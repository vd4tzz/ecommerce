spring:
  application:
    name: ecommerce

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
        format_sql: true
    show-sql: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:15m}
      refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:7d}
  storage:
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:ecommerce}
      region: ${APP_STORAGE_S3_REGION:vietnam}
      endpoint: ${APP_STORAGE_S3_ENDPOINT:http://localhost:8333}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:any}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:any}
      public-base-url: ${APP_STORAGE_S3_PUBLIC_BASE_URL:http://localhost:8333/ecommerce}
      presigned-duration-minutes: ${APP_STORAGE_S3_PRESIGNED_DURATION_MINUTES:15}
  payment:
    sepay:
      merchant: ${SEPAY_MERCHANT:SP-TEST-NV575945}
      secret-key: ${SEPAY_SECRET_KEY:spsk_test_9hLmPRpG5V1VM1yP1Agmt1kAShnJcAWh}
      checkout-url: ${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
      return-url: ${SEPAY_RETURN_URL:http://localhost:3000/orders}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
