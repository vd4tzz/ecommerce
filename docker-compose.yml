services:
  postgres:
    image: postgres:latest
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: ecommerce-seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333" # S3 API endpoint
      - "9333:9333" # Master server
      - "8888:8888" # Web UI (Filer UI)
    command: "server -s3 -filer -dir=/data"
    volumes:
      - seaweed_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port (cho backend gửi mail vào)
      - "8025:8025" # Web UI (mở trình duyệt xem mail)

volumes:
  postgres_data:
  seaweed_data:
